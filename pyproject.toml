[project]
name = "research-project-template"
version = "0.1.0"
description = "Correctness-first Python boilerplate for research projects."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Henry Castillo" }]
dependencies = [
    "beartype>=0.22.0",
    "jaxtyping>=0.3.0",
    "numpy>=2.0.0",
    "phantom-types[hypothesis]>=3.0.0",
]

[tool.uv]
package = false
required-version = ">=0.8.22"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "hypothesis>=6.0.0",
    "markdown-it-py>=4.2.0",
    "pre-commit>=4.6.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "rust-just>=1.58.0",
    "ty>=0.0.56",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "-m", "not slow",
    "--cov",
    "--cov-report=term-missing",
]
filterwarnings = ["error"]
xfail_strict = true
markers = [
    "property: property-based tests powered by Hypothesis",
    "slow: tests that are useful but too expensive for the default suite",
]

[tool.coverage.run]
branch = true
# Repository tools plus scaffold examples; add the research package when one exists.
source = ["scripts", "tests"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 95
precision = 2
exclude_also = ["if TYPE_CHECKING:"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = [".venv/", "docs/", "dist/", "build/"]

[tool.ty.rules]
all = "error"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "dist", "build", "out", "outputs", "logs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ANN", # flake8-annotations
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific correctness checks
]
ignore = [
    "E501", # line too long; formatting and prose readability own this
]

[tool.ruff.lint.isort]
known-first-party = ["scripts", "tests"]

[tool.vulture]
paths = ["."]
min_confidence = 60
sort_by_size = true
exclude = [
    ".venv/", ".git/", ".cache/", ".codex/worktrees/", "build/", "dist/", "data/", "artifacts/",
    "checkpoints/", "out/", "outputs/", "logs/", "runs/", "wandb/",
]
